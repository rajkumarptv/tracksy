<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracksy – Personal Finance</title>
  <meta name="description" content="Tracksy – Your personal finance management dashboard" />

  <!-- Google Analytics 4 (gtag.js). analytics/vite-analytics-plugin.mjs fills %VITE_GA_MEASUREMENT_ID% at build time
       and injects the async gtag.js loader above: production builds use G-TNP5J4QCZL, dev loads nothing, so local
       use never pollutes real data. The app sends events through window.gtag (src/lib/analytics.js).
       The default page_location drops the query string, which can hold tokens or search text. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    (function () {
      var id = '%VITE_GA_MEASUREMENT_ID%';
      if (!/^G-[A-Z0-9]+$/.test(id)) return;
      window.gtag = gtag;
      window.__TRACKSY_GA__ = id;
      var off = false;
      try { off = localStorage.getItem('tracksy-analytics-optout') === '1' || navigator.globalPrivacyControl === true; } catch (e) {}
      if (off) window['ga-disable-' + id] = true;   // Google's documented opt-out flag
      gtag('js', new Date());
      // page views are sent by the app on every route change, with ids and queries stripped
      gtag('config', id, { send_page_view: false, page_location: location.origin + location.pathname });
    })();
  </script>

  <!-- Google Tag Manager: OFF by default. Only loads if VITE_GTM_ID is set at build time (and then direct GA4
       above is switched off so nothing is double-sent). See analytics/README.md. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    (function () {
      var id = '%VITE_GTM_ID%';
      if (!/^GTM-[A-Z0-9]+$/.test(id)) return;
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0], j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', id);
    })();
  </script>

  <!-- Fonts: preconnect + swap so text never blocks on the font file -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1D4ED8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tracksy" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
